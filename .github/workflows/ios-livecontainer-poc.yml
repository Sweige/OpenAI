name: Build iOS LiveContainer PoC

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-livecontainer-poc-20261011
    paths:
      - "ios-livecontainer-poc/**"
      - ".github/workflows/ios-livecontainer-poc.yml"

permissions:
  contents: read

concurrency:
  group: ios-poc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Build own apps and package IPAs
        shell: bash
        run: bash ios-livecontainer-poc/scripts/build-ios.sh

      - name: Upload IPAs and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LiveContainer-PoC-${{ github.run_number }}
          path: ios-livecontainer-poc/artifacts/
          if-no-files-found: error
          retention-days: 7
