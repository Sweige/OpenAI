logLevel: info
logDestinations: [stdout]
api: false
metrics: false
pprof: false
playback: false
rtsp: false
rtmp: true
rtmpEncryption: "no"
rtmpAddress: 127.0.0.1:1936
hls: false
webrtc: false
srt: false
moq: false
authMethod: internal
authInternalUsers:
  - user: any
    ips: [127.0.0.1, "::1"]
    permissions:
      - action: publish
        path: live/obs
      - action: read
        path: live/obs
paths:
  live/obs:
    source: publisher
