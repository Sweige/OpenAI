# Test LAN only. This is our reproducible configuration, not the vendor's config.
listen              1936;
max_connections     20;
daemon              off;
srs_log_tank        console;
vhost __defaultVhost__ {
    tcp_nodelay on;
    min_latency on;
    play {
        gop_cache off;
        queue_length 0.2;
        mw_latency 0;
    }
}
